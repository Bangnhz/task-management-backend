spring:
  ai:
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      api-key: ${GEMINI_API_KEY}
      chat:
        options:
          model: gemini-3.5-flash-lite
          temperature: 0.2
        # Tắt toàn bộ retry ngầm của Spring AI
        retry:
          max-attempts: 1
          on-client-errors: false