app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Tắt toàn bộ auto-config mặc định của Spring AI OpenAI (vì dự án dùng cấu hình tùy biến geminiChatModel và groqChatModel trong AiModelConfig)
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
spring.ai.openai.chat.enabled=false
spring.ai.openai.embedding.enabled=false



# =========================
# GEMINI - PRIMARY
# =========================
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/openai
ai.gemini.completions-path=/chat/completions
ai.gemini.model=gemini-3.5-flash-lite

# =========================
# GROQ - FALLBACK
# =========================
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.base-url=https://api.groq.com/openai/v1
ai.groq.completions-path=/chat/completions
ai.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
